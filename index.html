<script>
  window.__ledgerErrors = [];
  window.addEventListener("error", function (e) {
    window.__ledgerErrors.push((e && e.message) ? e.message : (e && e.filename ? e.filename + " failed to load" : "unknown error"));
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    window.__ledgerErrors.push("Promise error: " + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
  });
</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<script>
window.storage = {
  get: async (key, shared) => {
    const raw = localStorage.getItem(key);
    if (raw === null) return null;
    return { key, value: raw, shared: !!shared };
  },
  set: async (key, value, shared) => {
    localStorage.setItem(key, value);
    return { key, value, shared: !!shared };
  },
  delete: async (key, shared) => {
    localStorage.removeItem(key);
    return { key, deleted: true, shared: !!shared };
  },
  list: async (prefix, shared) => {
    const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
    return { keys, prefix, shared: !!shared };
  }
};

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

// Watchdog: if the app hasn't mounted within a few seconds, show diagnostics
// instead of a silent blank screen.
setTimeout(function () {
  if (window.__ledgerMounted) return;
  var fb = document.getElementById("fallback");
  if (!fb) return;
  var missing = [];
  if (typeof React === "undefined") missing.push("React library did not load");
  if (typeof ReactDOM === "undefined") missing.push("ReactDOM library did not load");
  if (typeof Babel === "undefined") missing.push("Babel library did not load");
  var msgs = missing.concat(window.__ledgerErrors || []);
  if (msgs.length === 0) msgs = ["App did not finish loading for an unknown reason."];
  fb.innerHTML = "<div>Something went wrong:</div><div class='err'>" + msgs.join("<br><br>") + "</div>";
}, 4000);
</script>

const CONFETTI_COLORS = ["#c9a24b", "#4fb3a9", "#5b8ef2", "#a45bd6", "#eef0f5"];

const QUEST_LIBRARY = {

function flattenLibrary() {
  return Object.entries(QUEST_LIBRARY).flatMap(([cat, arr]) => arr.map(q => ({ ...q, category: cat })));
}

function pickRandom(arr, n) {
  const copy = [...arr];
  const result = [];
  while (result.length < n && copy.length > 0) {
    const idx = Math.floor(Math.random() * copy.length);
    result.push(copy.splice(idx, 1)[0]);
  }
  return result;
}

const TABS = [
  { id: "home",    label: "Home",    glyph: "\u2302" },
  { id: "daily",   label: "Quests",  glyph: "\u2694" },
  { id: "history", label: "History", glyph: "\u29D6" },
  { id: "you",     label: "You",     glyph: "\u2605" },
];

function xpForLevel(level) { return 80 + (level - 1) * 40; }

function levelFromTotalXp(totalXp) {
  let level = 1;
  let remaining = totalXp;
  while (remaining >= xpForLevel(level)) {
    remaining -= xpForLevel(level);
    level += 1;
  }
  return { level, into: remaining, need: xpForLevel(level) };
}

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function todayKey(d = new Date()) { return d.toISOString().slice(0, 10); }

function friendlyDate(ts) {
  const d = new Date(ts);
  const key = todayKey(d);
  if (key === todayKey()) return "Today";
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (key === todayKey(y)) return "Yesterday";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function rollLoot(difficultyKey) {
  const boost = DIFFICULTY[difficultyKey].lootBoost;
  const adjusted = LOOT_TABLE.map(row => ({ ...row, w: row.tier >= 2 ? row.weight * boost : row.weight }));
  const total = adjusted.reduce((sum, r) => sum + r.w, 0);
  let roll = Math.random() * total;
  for (const row of adjusted) {
    if (roll < row.w) {
      const name = row.names[Math.floor(Math.random() * row.names.length)];
      return { rarity: row.rarity, tier: row.tier, label: row.label, color: row.color, name, flavor: LOOT_FLAVOR[name] || "" };
    }
    roll -= row.w;
  }
  const last = adjusted[0];
  const name = last.names[0];
  return { rarity: last.rarity, tier: last.tier, label: last.label, color: last.color, name, flavor: LOOT_FLAVOR[name] || "" };
}

// ---- storage helpers ---------------------------------------------------

async function loadState() {
  try {
    const res = await window.storage.get("quest-ledger:state");
    if (res && res.value) return JSON.parse(res.value);
  } catch (e) {}
  return null;
}

async function saveState(state) {
  try { await window.storage.set("quest-ledger:state", JSON.stringify(state)); }
  catch (e) { console.error("save failed", e); }
}

// ---- root component -----------------------------------------------------

function QuestLedger() {
  const [page, setPage] = useState("home");
  const [quests, setQuests] = useState([]);
  const [totalXp, setTotalXp] = useState(0);
  const [completedDays, setCompletedDays] = useState([]);
  const [inventory, setInventory] = useState([]);
  const [unlockedAchievements, setUnlockedAchievements] = useState([]);
  const [discoveredNames, setDiscoveredNames] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [showForm, setShowForm] = useState(false);
  const [filter, setFilter] = useState("all");
  const [form, setForm] = useState({ title: "", category: "body", difficulty: "easy" });

  const [reveal, setReveal] = useState(null);
  const [levelUp, setLevelUp] = useState(null);
  const [toastQueue, setToastQueue] = useState([]);
  const [confetti, setConfetti] = useState([]);
  const [flash, setFlash] = useState(false);
  const [packMessage, setPackMessage] = useState(null);
  const packTimer = useRef(null);

  const revealTimer = useRef(null);
  const confettiTimer = useRef(null);
  const toastTimer = useRef(null);

  useEffect(() => {
    (async () => {
      const s = await loadState();
      if (s) {
        setQuests(s.quests || []);
        setTotalXp(s.totalXp || 0);
        setCompletedDays(s.completedDays || []);
        setInventory(s.inventory || []);
        setUnlockedAchievements(s.unlockedAchievements || []);
        setDiscoveredNames(s.discoveredNames || []);
      }
      setLoaded(true);
    })();
  }, []);

  const persist = useCallback((next) => saveState(next), []);

  useEffect(() => {
    if (!loaded) return;
    persist({ quests, totalXp, completedDays, inventory, unlockedAchievements, discoveredNames });
  }, [quests, totalXp, completedDays, inventory, unlockedAchievements, discoveredNames, loaded, persist]);

  useEffect(() => {
    if (toastQueue.length === 0) return;
    if (toastTimer.current) return;
    toastTimer.current = setTimeout(() => {
      setToastQueue(q => q.slice(1));
      toastTimer.current = null;
    }, 2600);
  }, [toastQueue]);

  const { level, into, need } = levelFromTotalXp(totalXp);
  const pct = Math.min(100, Math.round((into / need) * 100));
  const title = getTitle(level);

  function burstConfetti() {
    const particles = Array.from({ length: 26 }, () => ({
      id: uid(), left: Math.random() * 100, delay: Math.random() * 200,
      duration: 900 + Math.random() * 700,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      rotate: Math.random() * 360, size: 6 + Math.random() * 6,
    }));
    setConfetti(particles);
    if (confettiTimer.current) clearTimeout(confettiTimer.current);
    confettiTimer.current = setTimeout(() => setConfetti([]), 1700);
  }

  function addQuest(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (!form.title.trim()) return;
    const q = {
      id: uid(), title: form.title.trim(), category: form.category, difficulty: form.difficulty,
      status: "active", createdAt: Date.now(), completedAt: null,
    };
    setQuests(prev => [q, ...prev]);
    setForm({ title: "", category: form.category, difficulty: form.difficulty });
    setShowForm(false);
  }

  function rollQuestPack() {
    const existingTitles = new Set(quests.filter(q => q.status === "active").map(q => q.title));
    const full = flattenLibrary();
    const pool = full.filter(q => !existingTitles.has(q.title));
    const picks = pickRandom(pool.length >= 3 ? pool : full, 3);
    const now = Date.now();
    const newQuests = picks.map((p, i) => ({
      id: uid(), title: p.title, category: p.category, difficulty: p.difficulty,
      status: "active", createdAt: now + i, completedAt: null,
    }));
    setQuests(prev => [...newQuests, ...prev]);
    setPackMessage(`+${newQuests.length} quests added to your board`);
    if (packTimer.current) clearTimeout(packTimer.current);
    packTimer.current = setTimeout(() => setPackMessage(null), 2400);
  }

  function computeStreak(days) {
    if (days.length === 0) return 0;
    const set = new Set(days);
    let streak = 0;
    let d = new Date();
    if (!set.has(todayKey(d))) d.setDate(d.getDate() - 1);
    while (set.has(todayKey(d))) { streak += 1; d.setDate(d.getDate() - 1); }
    return streak;
  }

  function completeQuest(id) {
    const q = quests.find(q => q.id === id);
    if (!q || q.status === "completed") return;

    const key = todayKey();
    const todayCountBefore = quests.filter(
      x => x.status === "completed" && x.completedAt && todayKey(new Date(x.completedAt)) === key
    ).length;

    const baseXp = DIFFICULTY[q.difficulty].xp;
    const isCrit = Math.random() < 0.15;
    const comboBonus = todayCountBefore > 0 ? Math.min(5 * todayCountBefore, 25) : 0;
    const critXp = isCrit ? baseXp : 0;
    const totalGain = baseXp + critXp + comboBonus;
    const loot = rollLoot(q.difficulty);
    const now = Date.now();

    const nextQuests = quests.map(x => x.id === id ? { ...x, status: "completed", completedAt: now } : x);
    const nextTotalXp = totalXp + totalGain;
    const nextCompletedDays = completedDays.includes(key) ? completedDays : [...completedDays, key].sort();
    const nextInventory = [...inventory, { id: uid(), ...loot, questTitle: q.title, earnedAt: now }];

    setQuests(nextQuests);
    setTotalXp(nextTotalXp);
    setCompletedDays(nextCompletedDays);
    setInventory(nextInventory);

    const nextDiscovered = discoveredNames.includes(loot.name) ? discoveredNames : [...discoveredNames, loot.name];
    setDiscoveredNames(nextDiscovered);

    const before = levelFromTotalXp(totalXp).level;
    const after = levelFromTotalXp(nextTotalXp).level;

    const streakAfter = computeStreak(nextCompletedDays);
    const snapshot = {
      totalCompleted: nextQuests.filter(x => x.status === "completed").length,
      completedEpic: nextQuests.filter(x => x.status === "completed" && x.difficulty === "epic").length,
      streak: streakAfter, lootCount: nextInventory.length, level: after,
      uniqueLootCount: nextDiscovered.length,
      hasRare: nextInventory.some(i => i.tier >= 2),
      hasEpic: nextInventory.some(i => i.tier >= 3),
      hasLegendary: nextInventory.some(i => i.tier >= 4),
    };
    const newlyUnlocked = ACHIEVEMENTS.filter(a => !unlockedAchievements.includes(a.id) && a.check(snapshot));
    if (newlyUnlocked.length > 0) {
      setUnlockedAchievements(prev => [...prev, ...newlyUnlocked.map(a => a.id)]);
      setToastQueue(prev => [...prev, ...newlyUnlocked]);
    }

    setReveal({
      questTitle: q.title, baseXp, comboBonus, isCrit, totalGain,
      comboCount: todayCountBefore + 1, loot,
    });
    burstConfetti();
    if (isCrit) { setFlash(true); setTimeout(() => setFlash(false), 380); }
    if (revealTimer.current) clearTimeout(revealTimer.current);
    revealTimer.current = setTimeout(() => {
      setReveal(null);
      if (after > before) setLevelUp({ level: after, title: getTitle(after) });
    }, 2000);
  }

  function reopenQuest(id) {
    setQuests(prev => prev.map(x => {
      if (x.id !== id) return x;
      if (x.status === "completed") setTotalXp(t => Math.max(0, t - DIFFICULTY[x.difficulty].xp));
      return { ...x, status: "active", completedAt: null };
    }));
  }

  function deleteQuest(id) {
    const q = quests.find(q => q.id === id);
    if (q && q.status === "completed") setTotalXp(t => Math.max(0, t - DIFFICULTY[q.difficulty].xp));
    setQuests(prev => prev.filter(x => x.id !== id));
  }

  const streak = computeStreak(completedDays);
  const active = quests.filter(q => q.status === "active");
  const completed = quests.filter(q => q.status === "completed").sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));

  const shared = {
    quests, active, completed, streak, level, into, need, pct, title, totalXp,
    inventory, unlockedAchievements, discoveredNames, filter, setFilter, showForm, setShowForm,
    form, setForm, addQuest, completeQuest, reopenQuest, deleteQuest, setPage,
    rollQuestPack,
  };

  if (!loaded) {
    return (
      <div style={styles.page}>
        <div style={{ ...styles.body, alignItems: "center", justifyContent: "center", minHeight: "100vh" }}>
          <div style={{ color: "#7b8bab", fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, letterSpacing: "0.08em" }}>
            unrolling the ledger…

function HistoryPage({ completed, filter, setFilter, reopenQuest, deleteQuest, totalXp }) {
  const visible = filter === "all" ? completed : completed.filter(q => q.category === filter);
  const groups = [];
  let lastKey = null;
  visible.forEach(q => {
    const label = friendlyDate(q.completedAt);
    if (label !== lastKey) { groups.push({ label, items: [] }); lastKey = label; }
    groups[groups.length - 1].items.push(q);
  });

  return (
    <>
      <header style={styles.pageHeader}>
        <div style={styles.eyebrow}>QUEST HISTORY</div>
        <h1 style={styles.h1}>The Archive</h1>
        <div style={styles.titleLine}>{completed.length} quests completed &middot; {totalXp} xp earned lifetime</div>

              </div>
            );
          })}
        </div>
      </section>
    </>
  );

function groupInventory(inventory) {
  const map = new Map();
  [...inventory].reverse().forEach(item => {
    if (!map.has(item.name)) {
      map.set(item.name, { ...item, count: 1 });
    } else {
      map.get(item.name).count += 1;
    }
  });
  return Array.from(map.values()).sort((a, b) => b.tier - a.tier || b.count - a.count);
}

        strokeDashoffset={`${2 * Math.PI * 46 * (1 - pct / 100)}`}

      <text x="50" y="46" textAnchor="middle" fill="#eef0f5" fontSize="22" fontFamily="'Fraunces', serif">{level}</text>
      <text x="50" y="63" textAnchor="middle" fill="#7b8bab" fontSize="9" letterSpacing="1" fontFamily="'IBM Plex Mono', monospace">LEVEL</text>
